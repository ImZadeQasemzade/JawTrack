name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core-logic-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: core-logic unit tests (pure JVM, no Android SDK needed)
        run: ./gradlew :core-logic:test --stacktrace

  app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Lint + unit tests
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest --stacktrace
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
